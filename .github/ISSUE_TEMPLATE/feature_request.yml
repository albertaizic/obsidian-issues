name: Feature request
description: Suggest an improvement to Vault Issues
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        Vault Issues is intentionally small, local-first and desktop-only.
        The following are **out of scope** and will be closed:

        mobile support · AI features · GitHub or cloud synchronisation ·
        notifications · calendar integration · subtasks · issue dependencies ·
        analytics dashboards · additional statuses

        Everything else is fair game.

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: |
        Describe the situation you run into, not the feature you have in mind.
        This usually leads to a better solution than the one either of us
        started with.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
      description: Your suggested solution, if you have one.
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: What have you tried instead?
      description: |
        Workarounds you use today, or other plugins that solve part of this.
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I checked that this is not in the out-of-scope list above.
          required: true
        - label: I searched existing issues for this request.
          required: false
