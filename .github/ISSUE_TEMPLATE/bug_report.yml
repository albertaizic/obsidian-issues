name: Bug report
description: Something in Vault Issues does not work as expected
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please fill in as much as you can — the
        version numbers and reproduction steps are the parts that make a bug
        fixable.

        Vault Issues is desktop-only, so there is nothing to report for mobile.

  - type: input
    id: plugin-version
    attributes:
      label: Vault Issues version
      description: 'Settings → Community plugins → Installed plugins'
      placeholder: 0.9.0
    validations:
      required: true

  - type: input
    id: obsidian-version
    attributes:
      label: Obsidian version
      description: 'Settings → About → Current version'
      placeholder: 1.7.2
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What exactly did you do, in order?
      placeholder: |
        1. Open the issues view
        2. Select "+ new issue"
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected result
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: What happened instead?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Screenshots, console output or issue frontmatter
      description: |
        Errors from the developer console (Ctrl/Cmd + Shift + I) are especially
        useful. If the bug involves a specific issue file, paste its
        frontmatter. Please redact anything private first.
      render: text
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Anything else
      description: |
        Other plugins or a custom theme that might be involved, a non-default
        issues folder or ID prefix, an unusual vault layout — anything you
        think matters.
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I am running the latest release of Vault Issues.
          required: false
        - label: I searched existing issues for this bug.
          required: false
        - label: I can reproduce this with other plugins disabled.
          required: false
