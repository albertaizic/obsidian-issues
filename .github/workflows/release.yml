name: Release Obsidian plugin

on:
    push:
        tags:
            # Exact SemVer tags with no leading "v" — Obsidian requires the tag
            # to match manifest.json's version verbatim.
            - '[0-9]+.[0-9]+.[0-9]+'
            - '[0-9]+.[0-9]+.[0-9]+-*'

jobs:
    release:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            id-token: write
            attestations: write
        steps:
            - uses: actions/checkout@v6

            - name: Use Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: 'npm'

            # Run before anything is built or published: a mismatched tag must
            # fail the release, not produce a mislabelled one.
            - name: Verify tag matches manifest.json and package.json
              run: |
                  tag="${GITHUB_REF#refs/tags/}"
                  manifest_version="$(node -p "require('./manifest.json').version")"
                  package_version="$(node -p "require('./package.json').version")"

                  echo "tag:              $tag"
                  echo "manifest.json:    $manifest_version"
                  echo "package.json:     $package_version"

                  if [ "$tag" != "$manifest_version" ]; then
                    echo "::error::Tag '$tag' does not match manifest.json version '$manifest_version'."
                    exit 1
                  fi

                  if [ "$tag" != "$package_version" ]; then
                    echo "::error::Tag '$tag' does not match package.json version '$package_version'."
                    exit 1
                  fi

                  min_app_version="$(node -p "require('./manifest.json').minAppVersion")"
                  versions_entry="$(node -p "require('./versions.json')['$tag'] ?? ''")"

                  echo "minAppVersion:    $min_app_version"
                  echo "versions.json:    $versions_entry"

                  if [ "$versions_entry" != "$min_app_version" ]; then
                    echo "::error::versions.json['$tag'] is '$versions_entry', expected minAppVersion '$min_app_version'."
                    exit 1
                  fi

            - name: Install dependencies
              run: npm ci

            - name: Lint
              run: npm run lint

            - name: Test
              run: npm test

            - name: Build
              run: npm run build

            - name: Verify build output
              run: |
                  for file in main.js manifest.json styles.css; do
                    if [ ! -f "$file" ]; then
                      echo "::error::Release asset '$file' is missing."
                      exit 1
                    fi
                  done

            - name: Attest build provenance
              uses: actions/attest@v4
              with:
                  subject-path: |
                      main.js
                      styles.css

            # Draft, so the maintainer reviews the title and notes and decides
            # whether to mark it as a pre-release before publishing.
            - name: Create draft release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  tag="${GITHUB_REF#refs/tags/}"

                  gh release create "$tag" \
                    --title="$tag" \
                    --draft \
                    --notes="Review before publishing. See CHANGELOG.md for $tag." \
                    main.js manifest.json styles.css
